name: Bug report
description: Something in skillsniff is broken.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the output you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: skillsniff version
      placeholder: "skillsniff --version"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent (if any)
      placeholder: "Claude Code, Codex, none"
