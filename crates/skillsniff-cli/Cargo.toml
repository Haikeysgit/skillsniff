[package]
name = "skillsniff-cli"
description = "Command-line interface for skillsniff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "skillsniff"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
console = "0.16"
indicatif = "0.18"
serde_json = "1.0.154"
skillsniff = { version = "0.1.1", path = "../skillsniff" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
tempfile = "3.27.0"
